services:
  - type: web
    name: python-safety-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:combined_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
